name: Download ReadyForDeployment CPI Artifacts
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
  packages: read
 
jobs:
 
  download:
 
    runs-on: ubuntu-latest
 
    container:
      image: ghcr.io/deep2131/sap-cicd-runtime:1.5
 
    defaults:
      run:
        shell: bash
 
    env:
      SAP_BASE_URL: ${{ secrets.SAP_BASE_URL }}
      SAP_TOKEN_URL: ${{ secrets.SAP_TOKEN_URL }}
      SAP_CLIENT_ID: ${{ secrets.SAP_CLIENT_ID }}
      SAP_CLIENT_SECRET: ${{ secrets.SAP_CLIENT_SECRET }}
 
    steps:
 
      - name: Checkout Repository
        uses: actions/checkout@v5
 
      - name: Verify Generic Runtime
        run: |
          echo "Runtime:"
          which download-ready-iflows.sh
 
          echo
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"
 
      - name: Download ReadyForDeployment Artifacts
        run: |
          download-ready-iflows.sh
 
      - name: Verify Downloaded Artifacts
        run: |
          echo "======================================"
          echo "Downloaded CPI artifacts"
          echo "======================================"
 
          if [ ! -d "$GITHUB_WORKSPACE/artifacts" ]; then
            echo "::error::Artifact directory does not exist."
            exit 1
          fi
 
          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -name "*.zip" \
            -print
 
          ZIP_COUNT=$(find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -name "*.zip" \
            | wc -l)
 
          echo
          echo "ZIPs downloaded: $ZIP_COUNT"
 
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::No CPI artifacts were downloaded."
            exit 1
          fi
 
      - name: Upload Downloaded CPI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadyForDeployment-CPI-Artifacts
          path: ${{ github.workspace }}/artifacts/**/*.zip
          if-no-files-found: error
 
      - name: POC Summary
        run: |
          echo "======================================"
          echo "GENERIC SAP CI/CD CONTAINER SUCCESS"
          echo "======================================"
 
          echo
          echo "ReadyForDeployment artifacts:"
 
          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -name "*.zip" \
            -printf "%f\n"
