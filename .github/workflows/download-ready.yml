name: Download ReadyForDeployment CPI Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  download-ready-artifacts:

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/deep2131/sap-cicd-runtime:1.0

    defaults:
      run:
        shell: bash

    env:
      SAP_BASE_URL: ${{ secrets.SAP_BASE_URL }}
      SAP_TOKEN_URL: ${{ secrets.SAP_TOKEN_URL }}
      SAP_CLIENT_ID: ${{ secrets.SAP_CLIENT_ID }}
      SAP_CLIENT_SECRET: ${{ secrets.SAP_CLIENT_SECRET }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Verify Configuration
        run: |
          echo "======================================"
          echo "Configuration Check"
          echo "======================================"

          echo "BASE URL:"
          echo "$SAP_BASE_URL"

          echo ""
          echo "TOKEN URL:"
          echo "$SAP_TOKEN_URL"

      - name: Generate OAuth Token
        run: |

          TOKEN_RESPONSE=$(curl -s \
            -X POST "$SAP_TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=$SAP_CLIENT_ID" \
            -d "client_secret=$SAP_CLIENT_SECRET")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "OAuth failed"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "OAuth token generated successfully."

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Test CPI Design Time API
        run: |

          echo "======================================"
          echo "Testing CPI API"
          echo "======================================"

          API_URL="$SAP_BASE_URL/api/v1/IntegrationDesigntimeArtifacts"

          echo "Calling:"
          echo "$API_URL"

          echo ""
          echo "Response headers:"

          curl -v \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "$API_URL"

      - name: Show Workspace
        if: always()
        run: |
          pwd
          ls -lah
