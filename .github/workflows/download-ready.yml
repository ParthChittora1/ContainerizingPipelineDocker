# ---------------------------------------------------
# Debug CPI API Response
# ---------------------------------------------------
- name: Debug CPI API
  run: |
    echo "======================================"
    echo "CPI API Debug"
    echo "======================================"

    echo ""
    echo "Base URL:"
    echo "$SAP_BASE_URL"

    echo ""
    echo "Generating OAuth token..."

    TOKEN_RESPONSE=$(curl \
      --silent \
      --show-error \
      --request POST \
      "$SAP_TOKEN_URL" \
      --user "$SAP_CLIENT_ID:$SAP_CLIENT_SECRET" \
      --header "Content-Type: application/x-www-form-urlencoded" \
      --data "grant_type=client_credentials")

    echo ""
    echo "Token Response:"
    echo "$TOKEN_RESPONSE"

    ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

    if [ -z "$ACCESS_TOKEN" ]; then
      echo "ERROR: Access token not generated"
      exit 1
    fi

    echo ""
    echo "Access token generated successfully"

    echo ""
    echo "======================================"
    echo "CALLING CPI API"
    echo "======================================"

    API_URL="${SAP_BASE_URL}/api/v1/IntegrationDesigntimeArtifacts"

    echo "URL:"
    echo "$API_URL"

    echo ""
    echo "Response:"
    echo "--------------------------------------"

    curl -v \
      --header "Authorization: Bearer ${ACCESS_TOKEN}" \
      --header "Accept: application/json" \
      "$API_URL"

    echo ""
    echo "--------------------------------------"
